<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Slot Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="arcade-container">
        <header>
            <h1>IDEA SLOT MACHINE</h1>
        </header>

        <div class="machine">
            <div class="reels-wrapper">
                <!-- Reel 1 -->
                <div class="reel-column">
                    <div class="reel-header">AUDIENCE</div>
                    <div id="reel-audience" class="reel-display">?</div>
                    <div class="lock-container">
                        <input type="checkbox" id="lock-audience" class="lock-toggle">
                        <label for="lock-audience">LOCK</label>
                    </div>
                </div>

                <!-- Reel 2 -->
                <div class="reel-column">
                    <div class="reel-header">PROBLEM</div>
                    <div id="reel-problem" class="reel-display">?</div>
                    <div class="lock-container">
                        <input type="checkbox" id="lock-problem" class="lock-toggle">
                        <label for="lock-problem">LOCK</label>
                    </div>
                </div>

                <!-- Reel 3 -->
                <div class="reel-column">
                    <div class="reel-header">TWIST</div>
                    <div id="reel-twist" class="reel-display">?</div>
                    <div class="lock-container">
                        <input type="checkbox" id="lock-twist" class="lock-toggle">
                        <label for="lock-twist">LOCK</label>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="lever-btn" class="lever-button">PULL LEVER!</button>
                <button id="save-btn" class="save-button">SAVE IDEA</button>
            </div>
        </div>

        <section class="vault">
            <h2>THE VAULT</h2>
            <div id="vault-list"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
